<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary Appeal - Trust & Reputation Engine</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trust Engine">
    <meta name="theme-color" content="#020617">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #020617 0%, #0b0f19 50%, #020617 100%);
            --panel-bg: rgba(15, 23, 42, 0.65);
            --neon-blue: #38bdf8;
            --neon-indigo: #6366f1;
            --text-main: #f8fafc;
            --green-glow: #22c55e;
            --yellow-glow: #eab308;
            --red-glow: #ef4444;
            --cash-app-green: #00D632;
            --current-glow: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 2px solid var(--neon-indigo);
            padding: 40px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15), inset 0 0 15px rgba(99, 102, 241, 0.05);
            position: relative;
            transition: border-color 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), #fff, var(--neon-blue), transparent);
            opacity: 0;
            z-index: 10;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        @keyframes scanning {
            0% { top: 0%; opacity: 1; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px dashed rgba(99, 102, 241, 0.2);
            padding-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--neon-blue);
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            background: linear-gradient(90deg, #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .executive-meta {
            margin-top: 10px;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .executive-sub {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .app-install-banner {
            display: none;
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 25px;
            align-items: center;
            justify-content: space-between;
            animation: panelPop 0.4s ease forwards;
        }

        .install-text {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-install-now {
            background: var(--neon-blue);
            color: #020617;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--neon-blue);
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            background: #020617;
            border: 2px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            transform: scale(1.01);
        }

        .ocr-upload-zone {
            border: 2px dashed rgba(56, 189, 248, 0.3);
            background: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .ocr-upload-zone:hover {
            border-color: var(--neon-blue);
            background: rgba(56, 189, 248, 0.04);
        }

        .ocr-text-prompt {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ocr-text-prompt span {
            color: var(--neon-blue);
            font-weight: 800;
        }

        .file-status-badge {
            display: none;
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--green-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-audit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            border-bottom: 4px solid #3730a3;
            margin-top: 25px;
        }

        .btn-audit:active {
            transform: translateY(3px);
            border-bottom: 1px solid #3730a3;
        }

        .output-panel {
            margin-top: 35px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(2, 6, 23, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: none;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
            animation: panelPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes panelPop {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .signal-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.02);
            padding: 18px;
            border-radius: 14px;
            border-left: 4px solid var(--current-glow);
        }

        .traffic-light {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1e293b;
            transition: all 0.5s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .status-title {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .result-details p {
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .label-bold {
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.78rem;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .counter-glow-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .logger-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed rgba(99, 102, 241, 0.2);
        }

        .logger-section h3 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        .log-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .log-table th {
            color: #475569;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 0 12px;
        }

        .log-table td {
            padding: 16px;
            background: rgba(2, 6, 23, 0.4);
            border-top: 1px solid rgba(99, 102, 241, 0.08);
            border-bottom: 1px solid rgba(99, 102, 241, 0.08);
        }

        .log-table tr td:first-child { border-left: 1px solid rgba(99, 102, 241, 0.08); border-radius: 10px 0 0 10px; }
        .log-table tr td:last-child { border-right: 1px solid rgba(99, 102, 241, 0.08); border-radius: 0 10px 10px 0; text-align: right; }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .badge-green { background: rgba(34, 197, 94, 0.12); color: var(--green-glow); border: 1px solid var(--green-glow); }
        .badge-yellow { background: rgba(234, 179, 8, 0.12); color: var(--yellow-glow); border: 1px solid var(--yellow-glow); }
        .badge-red { background: rgba(239, 68, 68, 0.12); color: var(--red-glow); border: 1px solid var(--red-glow); }

        .donation-section {
            margin-top: 45px;
            padding-top: 30px;
            border-top: 2px dashed rgba(99, 102, 241, 0.2);
            text-align: center;
        }

        .btn-cashapp {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 10px;
            background: var(--cash-app-green);
            color: #020617;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(0, 214, 50, 0.25);
        }
    </style>
</head>
<body>

    <div class="scan-line" id="radarLine"></div>

    <div class="app-install-banner" id="installBanner">
        <div class="install-text">📲 INSTALL TRUST ENGINE TO HOME SCREEN</div>
        <button class="btn-install-now" id="installBtn">Install App</button>
    </div>
