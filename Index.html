<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary Appeal - Trust & Reputation Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green-light: #22c55e;
            --yellow-light: #eab308;
            --red-light: #ef4444;
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #4f46e5;
        }

        button:active {
            transform: scale(0.99);
        }

        .output-panel {
            margin-top: 40px;
            padding: 24px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            display: none;
        }

        .signal-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .traffic-light {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #334155;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .status-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .result-details p {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .label-bold {
            font-weight: bold;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TRUST & REPUTATION ENGINE</h1>
        <p>Automated Red Light, Green Light Framework</p>
    </header>

    <div class="input-group">
        <label for="platformName">Platform / Domain Name</label>
        <input type="text" id="platformName" placeholder="e.g., target-platform.com" required>
    </div>

    <div class="input-group">
        <label for="domainAge">Domain Age</label>
        <select id="domainAge">
            <option value="old">Established (Greater than 30 Days)</option>
            <option value="new">Brand New (Less than 30 Days)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="blacklistStatus">Blacklist & Fraud Logs Check</label>
        <select id="blacklistStatus">
            <option value="clean">Clean (No malicious patterns or scam reports)</option>
            <option value="flagged">Flagged / Active Scam Reports Found</option>
        </select>
    </div>

    <div class="input-group">
        <label for="compliance">Compliance & Metadata Verification</label>
        <select id="compliance">
            <option value="verified">Verified Compliance (Secure layout & clear ownership)</option>
            <option value="unverified">Unverified Metadata (Hidden details / Missing protocol)</option>
        </select>
    </div>

    <button onclick="evaluatePlatform()">Run Automated Audit</button>

    <div class="output-panel" id="outputPanel">
        <div class="signal-container">
            <div class="traffic-light" id="lightSignal"></div>
            <div class="status-title" id="statusTitle">---</div>
        </div>
        <div class="result-details">
            <p><span class="label-bold">Target Target:</span> <span id="resName"></span></p>
            <p><span class="label-bold">Automated Action:</span> <span id="resAction"></span></p>
            <p><span class="label-bold">Operational Next Steps:</span> <span id="resSteps"></span></p>
        </div>
    </div>
</div>

<script>
    function evaluatePlatform() {
        const name = document.getElementById('platformName').value.trim() || "Unknown Platform";
        const age = document.getElementById('domainAge').value;
        const blacklist = document.getElementById('blacklistStatus').value;
        const compliance = document.getElementById('compliance').value;

        const panel = document.getElementById('outputPanel');
        const light = document.getElementById('lightSignal');
        const title = document.getElementById('statusTitle');
        const resName = document.getElementById('resName');
        const resAction = document.getElementById('resAction');
        const resSteps = document.getElementById('resSteps');

        panel.style.display = "block";
        resName.innerText = name;

        // 🔴 RED LIGHT CONDITIONS
        if (blacklist === 'flagged') {
            light.style.backgroundColor = 'var(--red-light)';
            light.style.boxShadow = '0 0 20px var(--red-light)';
            title.innerText = "RED LIGHT - AUTOMATED BLOCK";
            title.style.color = 'var(--red-light)';
            resAction.innerText = "Immediate system-wide block executed. Malicious templates or active fraud logs detected.";
            resSteps.innerText = "Flag entry, alert the community pool, and generate a formal automated fraud signature.";
        }
        // 🟡 YELLOW LIGHT CONDITIONS
        else if (age === 'new' || compliance === 'unverified') {
            light.style.backgroundColor = 'var(--yellow-light)';
            light.style.boxShadow = '0 0 20px var(--yellow-light)';
            title.innerText = "YELLOW LIGHT - CAUTION HOLD";
            title.style.color = 'var(--yellow-light)';
            resAction.innerText = "Velocity pause applied. Platform falls below baseline automation trust requirements.";
            resSteps.innerText = "Hold processing. Request additional domain ownership verification and cross-reference records manually.";
        }
        // 🟢 GREEN LIGHT CONDITIONS
        else {
            light.style.backgroundColor = 'var(--green-light)';
            light.style.boxShadow = '0 0 20px var(--green-light)';
            title.innerText = "GREEN LIGHT - FULL VELOCITY";
            title.style.color = 'var(--green-light)';
            resAction.innerText = "All architectural guardrails clear. Platform verified safe.";
            resSteps.innerText = "Issue trusted verification badge, log to database, and proceed with full operational velocity.";
        }
    }
</script>

</body>
</html>
